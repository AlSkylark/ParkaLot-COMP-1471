<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
    <head>
        <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}" />
        <script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>
        <script th:src="@{/js/dropdowns.js}"></script>
    </head>
    <body>
        <div th:replace="~{header}"></div>

        <div th:replace="${content}"></div>
    </body>
    <script>
        /**
         * Returns a YYYY-MM-DD string using the LOCAL calendar date,
         * avoiding the UTC shift that toISOString() introduces in
         * timezones east of UTC (e.g. BST = UTC+1).
         */
        function localDate(d = new Date()) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        }
    </script>
</html>
