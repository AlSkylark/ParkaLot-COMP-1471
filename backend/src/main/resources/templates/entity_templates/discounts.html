<div th:replace="~{ layout :: layout(~{::content}) }">
    <div th:fragment="content">
        <div
            th:replace="~{entity_templates/items_list :: item_list('discount', ~{::new_discount}, ${list}, ~{::discount}, ~{::discount_label})}"
        >
            <div th:fragment="new_discount">
                <!-- Discount Type -->
                <div class="row">
                    <div class="col">
                        <div class="mb-3">
                            <label class="form-label">Discount Type</label>
                            <select
                                class="form-select"
                                name="discountType"
                                id="new_discount_type_dropdown"
                            >
                                <option value="">-- Select Type --</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Percentage + Flat Amount -->
                <div class="row">
                    <div class="col">
                        <div class="mb-3">
                            <label class="form-label">Percentage Amount</label>
                            <div class="input-group">
                                <input
                                    type="number"
                                    class="form-control"
                                    name="percentageAmount"
                                    id="new_percentageAmount"
                                    placeholder="e.g. 10"
                                    oninput="
                                        handleDiscountInput(
                                            this,
                                            'new_flatAmount',
                                        )
                                    "
                                />
                                <span class="input-group-text">%</span>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="mb-3">
                            <label class="form-label">Flat Amount</label>
                            <div class="input-group">
                                <span class="input-group-text">£</span>
                                <input
                                    type="number"
                                    step="0.01"
                                    class="form-control"
                                    name="flatAmount"
                                    id="new_flatAmount"
                                    placeholder="e.g. 5.00"
                                    oninput="
                                        handleDiscountInput(
                                            this,
                                            'new_percentageAmount',
                                        )
                                    "
                                />
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div th:fragment="discount">
                <!-- Discount Type -->
                <div class="row">
                    <div class="col">
                        <div class="mb-3">
                            <label class="form-label">Discount Type</label>
                            <select
                                class="form-select"
                                name="discountType"
                                th:attr="id=|discount_type_dropdown${item.id}|"
                                th:data-current-discount-type="${item.discountType}"
                            >
                                <option value="">-- Select Type --</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Percentage + Flat Amount -->
                <div class="row">
                    <div class="col">
                        <div class="mb-3">
                            <label class="form-label">Percentage Amount</label>
                            <div class="input-group">
                                <input
                                    type="number"
                                    class="form-control"
                                    name="percentageAmount"
                                    th:value="${item.percentageAmount}"
                                    th:attr="id=|percentageAmount${item.id}|, oninput=|handleDiscountInput(this, 'flatAmount${item.id}')|"
                                    th:disabled="${item.flatAmount != null}"
                                />
                                <span class="input-group-text">%</span>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="mb-3">
                            <label class="form-label">Flat Amount</label>
                            <div class="input-group">
                                <span class="input-group-text">£</span>
                                <input
                                    type="number"
                                    step="0.01"
                                    class="form-control"
                                    name="flatAmount"
                                    th:value="${item.flatAmount}"
                                    th:attr="id=|flatAmount${item.id}|, oninput=|handleDiscountInput(this, 'percentageAmount${item.id}')|"
                                    th:disabled="${item.percentageAmount != null}"
                                />
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div th:fragment="discount_label">
                <span
                    th:if="${item.discountType != null}"
                    th:text="${T(com.parkalot.infrastructure.enums.DiscountType).values()[item.discountType].label}"
                >
                </span>
                <span
                    th:if="${item.percentageAmount != null}"
                    class="badge bg-primary ms-2"
                    th:text="${item.percentageAmount + '%'}"
                >
                </span>
                <span
                    th:if="${item.flatAmount != null}"
                    class="badge bg-success ms-2"
                    th:text="'£' + ${#numbers.formatDecimal(item.flatAmount, 1, 'COMMA', 2, 'POINT')}"
                >
                </span>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", async function () {
        const discountTypes = await fetch("/enums/discount-types").then((r) =>
            r.json(),
        );
        populateDropdowns(
            '[id^="discount_type_dropdown"], #new_discount_type_dropdown',
            discountTypes,
            "currentDiscountType",
        );
    });
</script>
