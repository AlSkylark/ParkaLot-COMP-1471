<div th:replace="~{ layout :: layout(~{::content}) }">
    <div th:fragment="content">
        <div
            th:replace="~{entity_templates/items_list :: item_list('pricetype', ~{::new_price_type}, ${list}, ~{::price_type}, ~{::price_type_label})}"
        >
            <div th:fragment="new_price_type">
                <div class="row">
                    <div class="col">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input
                                type="text"
                                class="form-control"
                                name="name"
                            />
                        </div>
                    </div>
                    <div class="col">
                        <div class="mb-3">
                            <label class="form-label">Price</label>
                            <div class="input-group">
                                <span class="input-group-text">£</span>
                                <input
                                    type="number"
                                    step="0.01"
                                    class="form-control"
                                    name="price"
                                />
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div th:fragment="price_type">
                <div class="row">
                    <div class="col">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input
                                type="text"
                                class="form-control"
                                name="name"
                                th:value="${item.name}"
                            />
                        </div>
                    </div>
                    <div class="col">
                        <div class="mb-3">
                            <label class="form-label">Price</label>
                            <div class="input-group">
                                <span class="input-group-text">£</span>
                                <input
                                    type="number"
                                    step="0.01"
                                    class="form-control"
                                    name="price"
                                    th:value="${item.price}"
                                />
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div th:fragment="price_type_label">
                <span th:text="${item.name}"></span>
                <span
                    class="badge bg-success ms-2"
                    th:text="'£' + ${#numbers.formatDecimal(item.price, 1, 'COMMA', 2, 'POINT')}"
                ></span>
            </div>
        </div>
    </div>
</div>
