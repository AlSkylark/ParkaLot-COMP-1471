<div th:replace="~{ layout :: layout(~{::content}) }">
    <div th:fragment="content">
        <div
            th:replace="~{entity_templates/items_list :: item_list('garage', ~{::new_garage}, ${list}, ~{::garage}, ~{::garage_label})}"
        >
            <div th:fragment="new_garage">
                <div class="row">
                    <div class="col">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input
                                type="text"
                                class="form-control"
                                name="name"
                            />
                        </div>
                    </div>
                    <div class="col">
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <select
                                class="form-select"
                                name="address.id"
                                id="new_address_dropdown"
                            >
                                <option value="">-- Select Address --</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div th:fragment="garage">
                <!-- Name + Address -->
                <div class="row">
                    <div class="col">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input
                                type="text"
                                class="form-control"
                                name="name"
                                th:value="${item.name}"
                            />
                        </div>
                    </div>
                    <div class="col">
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <select
                                class="form-select"
                                name="address.id"
                                th:attr="id=|address_dropdown${item.id}|"
                                th:data-current-address="${item.address != null ? item.address.id : ''}"
                            >
                                <option value="">-- Select Address --</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Scanners -->
                <div
                    class="d-flex justify-content-between align-items-center mb-2"
                >
                    <h6 class="mb-0">Scanners</h6>
                    <button
                        type="button"
                        class="btn btn-sm btn-outline-primary"
                        th:onclick="|toggleAddScanner(${item.id})|"
                    >
                        + Add Scanner
                    </button>
                </div>
                <div class="card mb-3">
                    <div class="card-body text-center py-4">
                        <div>
                            <!-- Add scanner form -->
                            <div
                                th:id="|add-scanner-form-${item.id}|"
                                class="card mb-2 d-none"
                            >
                                <div class="card-body">
                                    <div class="row g-2 align-items-end">
                                        <div class="col-sm">
                                            <label class="form-label small mb-1"
                                                >Type</label
                                            >
                                            <select
                                                class="form-select form-select-sm"
                                                th:id="|scanner-type-${item.id}|"
                                            >
                                                <option value="0">Entry</option>
                                                <option value="1">Exit</option>
                                                <option value="2">Both</option>
                                            </select>
                                        </div>
                                        <div class="col-auto">
                                            <button
                                                type="button"
                                                class="btn btn-sm btn-primary"
                                                th:onclick="|addScanner(${item.id})|"
                                            >
                                                Save
                                            </button>
                                            <button
                                                type="button"
                                                class="btn btn-sm btn-outline-secondary"
                                                th:onclick="|toggleAddScanner(${item.id})|"
                                            >
                                                Cancel
                                            </button>
                                        </div>
                                    </div>
                                    <div
                                        th:id="|scanner-error-${item.id}|"
                                        class="alert alert-danger alert-sm mt-2 py-1 d-none small"
                                    ></div>
                                </div>
                            </div>

                            <!-- Scanners list (populated via fetch) -->
                            <div th:id="|scanners-list-${item.id}|">
                                <div class="text-muted small text-center py-2">
                                    <span
                                        class="spinner-border spinner-border-sm me-1"
                                    ></span>
                                    Loading scanners&hellip;
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Parking Spaces -->
                <div
                    class="d-flex justify-content-between align-items-center mb-2"
                >
                    <h6 class="mb-0">Parking Spaces</h6>
                    <button
                        type="button"
                        class="btn btn-sm btn-outline-primary"
                        th:onclick="|toggleAddSpace(${item.id})|"
                    >
                        + Add Space
                    </button>
                </div>
                <div class="card mb-3">
                    <div class="card-body text-center py-4">
                        <div>
                            <!-- Add space form -->
                            <div
                                th:id="|add-space-form-${item.id}|"
                                class="card mb-2 d-none"
                            >
                                <div class="card-body">
                                    <div class="row g-2 align-items-end">
                                        <div class="col-sm">
                                            <label class="form-label small mb-1"
                                                >Code</label
                                            >
                                            <input
                                                type="text"
                                                class="form-control form-control-sm"
                                                th:id="|space-code-${item.id}|"
                                                placeholder="e.g. A001"
                                            />
                                        </div>
                                        <div class="col-sm">
                                            <label class="form-label small mb-1"
                                                >Floor</label
                                            >
                                            <input
                                                type="text"
                                                class="form-control form-control-sm"
                                                th:id="|space-floor-${item.id}|"
                                                placeholder="e.g. Ground"
                                            />
                                        </div>
                                        <div class="col-sm">
                                            <label class="form-label small mb-1"
                                                >Type</label
                                            >
                                            <select
                                                class="form-select form-select-sm"
                                                th:id="|space-type-${item.id}|"
                                            >
                                                <option value="0">
                                                    Normal
                                                </option>
                                                <option value="1">
                                                    Electric
                                                </option>
                                            </select>
                                        </div>
                                        <div class="col-auto">
                                            <button
                                                type="button"
                                                class="btn btn-sm btn-primary"
                                                th:onclick="|addSpace(${item.id})|"
                                            >
                                                Save
                                            </button>
                                            <button
                                                type="button"
                                                class="btn btn-sm btn-outline-secondary"
                                                th:onclick="|toggleAddSpace(${item.id})|"
                                            >
                                                Cancel
                                            </button>
                                        </div>
                                    </div>
                                    <div
                                        th:id="|space-error-${item.id}|"
                                        class="alert alert-danger alert-sm mt-2 py-1 d-none small"
                                    ></div>
                                </div>
                            </div>

                            <!-- Spaces list (populated via fetch) -->
                            <div th:id="|spaces-list-${item.id}|">
                                <div class="text-muted small text-center py-2">
                                    <span
                                        class="spinner-border spinner-border-sm me-1"
                                    ></span>
                                    Loading spaces&hellip;
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div th:fragment="garage_label">
                <span th:text="${item.name}"></span>
                <span
                    th:if="${item.address != null}"
                    class="text-muted ms-2 small"
                    th:text="${item.address.address1 + ', ' + item.address.town}"
                ></span>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    // ── Address dropdowns ───────────────────────────────────
    document.addEventListener("DOMContentLoaded", async function () {
        const addresses = await fetch("/api/addresses/dropdown").then((r) =>
            r.json(),
        );
        populateDropdowns(
            '[id^="address_dropdown"], #new_address_dropdown',
            addresses,
            "currentAddress",
        );

        // Lazy-load spaces + scanners when a garage accordion opens
        document.querySelectorAll('[id^="collapse"]').forEach((el) => {
            el.addEventListener("show.bs.collapse", function () {
                const garageId = this.id.replace("collapse", "");
                loadSpaces(garageId);
                loadScanners(garageId);
            });
        });
    });

    // ── Spaces ─────────────────────────────────────────────
    const garageSpaces = {}; // cache: garageId → spaces[]
    const selectedFloors = {}; // state:  garageId → floor prefix

    async function loadSpaces(garageId) {
        const list = document.getElementById(`spaces-list-${garageId}`);
        try {
            const spaces = await fetch(`/api/garages/${garageId}/spaces`).then(
                (r) => r.json(),
            );
            garageSpaces[garageId] = spaces;
            renderSpaces(garageId);
        } catch {
            list.innerHTML = `<small class="text-danger">Failed to load spaces.</small>`;
        }
    }

    function renderSpaces(garageId) {
        const list = document.getElementById(`spaces-list-${garageId}`);
        const spaces = garageSpaces[garageId] ?? [];

        if (spaces.length === 0) {
            list.innerHTML = `<small class="text-muted">No spaces yet.</small>`;
            return;
        }

        const floors = [
            ...new Set(spaces.map((s) => s.code.substring(0, 2))),
        ].sort();

        // Keep selection if still valid, otherwise default to first floor
        if (
            !selectedFloors[garageId] ||
            !floors.includes(selectedFloors[garageId])
        ) {
            selectedFloors[garageId] = floors[0];
        }

        list.innerHTML = `
            <div class="d-flex gap-3">
                <div class="d-flex flex-column gap-1" id="floor-btns-${garageId}" style="min-width:60px;">
                    ${floors
                        .map(
                            (f) => `
                        <button type="button"
                                class="btn btn-sm ${f === selectedFloors[garageId] ? "btn-primary" : "btn-outline-secondary"}"
                                onclick="selectFloor(${garageId}, '${f}', this)">
                            ${f}
                        </button>
                    `,
                        )
                        .join("")}
                </div>
                <div class="flex-grow-1" id="spaces-grid-${garageId}">
                    ${buildSpacesGrid(garageId)}
                </div>
            </div>`;
    }

    function buildSpacesGrid(garageId) {
        const floor = selectedFloors[garageId];
        const filtered = (garageSpaces[garageId] ?? []).filter((s) =>
            s.code.startsWith(floor),
        );
        if (filtered.length === 0)
            return `<small class="text-muted">No spaces on this floor.</small>`;
        return `<div class="d-flex flex-wrap gap-2">
            ${filtered
                .map(
                    (s) => `
                <div class="card">
                    <div class="card-body py-1 px-2 d-flex align-items-center gap-2">
                        <small class="fw-bold">${s.code}</small>
                        <span class="badge ${s.type === "ELECTRIC" ? "bg-success" : "bg-secondary"}"
                              style="font-size:0.6rem;">
                            ${s.type === "ELECTRIC" ? "Electric" : "Normal"}
                        </span>
                        <button type="button" class="btn-close" style="font-size:0.5rem;"
                                onclick="deleteSpace(${garageId}, '${s.code}')"></button>
                    </div>
                </div>
            `,
                )
                .join("")}
        </div>`;
    }

    function selectFloor(garageId, floor, btn) {
        selectedFloors[garageId] = floor;
        document
            .querySelectorAll(`#floor-btns-${garageId} button`)
            .forEach((b) => {
                b.className = "btn btn-sm btn-outline-secondary";
            });
        btn.className = "btn btn-sm btn-primary";
        document.getElementById(`spaces-grid-${garageId}`).innerHTML =
            buildSpacesGrid(garageId);
    }

    function toggleAddSpace(garageId) {
        document
            .getElementById(`add-space-form-${garageId}`)
            .classList.toggle("d-none");
    }

    async function addSpace(garageId) {
        const code = document
            .getElementById(`space-code-${garageId}`)
            .value.trim();
        const floor = document
            .getElementById(`space-floor-${garageId}`)
            .value.trim();
        const spacetype = parseInt(
            document.getElementById(`space-type-${garageId}`).value,
        );
        const errorEl = document.getElementById(`space-error-${garageId}`);

        if (!code || !floor) {
            errorEl.textContent = "Code and floor are required.";
            errorEl.classList.remove("d-none");
            return;
        }

        try {
            const res = await fetch(`/api/garages/${garageId}/spaces`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ code, floor, type: spacetype }),
            });
            if (!res.ok) throw new Error(await res.text());
            errorEl.classList.add("d-none");
            document.getElementById(`space-code-${garageId}`).value = "";
            document.getElementById(`space-floor-${garageId}`).value = "";
            toggleAddSpace(garageId);
            await loadSpaces(garageId);
        } catch (e) {
            errorEl.textContent = "Failed to add space. Is the code unique?";
            errorEl.classList.remove("d-none");
        }
    }

    async function deleteSpace(garageId, spaceCode) {
        if (!confirm(`Delete space ${spaceCode}? This cannot be undone.`))
            return;
        try {
            const res = await fetch(
                `/api/garages/${garageId}/spaces/${spaceCode}`,
                { method: "DELETE" },
            );
            if (!res.ok) throw new Error();
            await loadSpaces(garageId);
        } catch {
            alert("Failed to delete space.");
        }
    }

    // ── Scanners ────────────────────────────────────────────
    const SCANNER_LABELS = { ENTRY: "Entry", EXIT: "Exit", BOTH: "Both" };
    const SCANNER_BADGES = {
        ENTRY: "bg-info text-dark",
        EXIT: "bg-warning text-dark",
        BOTH: "bg-primary",
    };

    async function loadScanners(garageId) {
        const list = document.getElementById(`scanners-list-${garageId}`);
        try {
            const scanners = await fetch(
                `/api/garages/${garageId}/scanners`,
            ).then((r) => r.json());
            renderScanners(garageId, scanners);
        } catch {
            list.innerHTML = `<small class="text-danger">Failed to load scanners.</small>`;
        }
    }

    function renderScanners(garageId, scanners) {
        const list = document.getElementById(`scanners-list-${garageId}`);
        if (scanners.length === 0) {
            list.innerHTML = `<small class="text-muted">No scanners yet.</small>`;
            return;
        }
        list.innerHTML = `<div class="d-flex flex-wrap gap-2">${scanners
            .map(
                (s) => `
            <div class="card">
                <div class="card-body py-1 px-2 d-flex align-items-center gap-2">
                    <small class="fw-bold">SCN-${String(s.id).padStart(3, "0")}</small>
                    <span class="badge ${SCANNER_BADGES[s.type] ?? "bg-secondary"}"
                          style="font-size:0.6rem;">
                        ${SCANNER_LABELS[s.type] ?? "Unknown"}
                    </span>
                    <button type="button" class="btn-close" style="font-size:0.5rem;"
                            onclick="deleteScanner(${garageId}, ${s.id})"></button>
                </div>
            </div>
        `,
            )
            .join("")}</div>`;
    }

    function toggleAddScanner(garageId) {
        document
            .getElementById(`add-scanner-form-${garageId}`)
            .classList.toggle("d-none");
    }

    async function addScanner(garageId) {
        const scannertype = parseInt(
            document.getElementById(`scanner-type-${garageId}`).value,
        );
        const errorEl = document.getElementById(`scanner-error-${garageId}`);
        try {
            const res = await fetch(`/api/garages/${garageId}/scanners`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ scannertype }),
            });
            if (!res.ok) throw new Error();
            errorEl.classList.add("d-none");
            toggleAddScanner(garageId);
            await loadScanners(garageId);
        } catch {
            errorEl.textContent = "Failed to add scanner.";
            errorEl.classList.remove("d-none");
        }
    }

    async function deleteScanner(garageId, scannerId) {
        if (!confirm("Delete this scanner? This cannot be undone.")) return;
        try {
            const res = await fetch(
                `/api/garages/${garageId}/scanners/${scannerId}`,
                { method: "DELETE" },
            );
            if (!res.ok) throw new Error();
            await loadScanners(garageId);
        } catch {
            alert("Failed to delete scanner.");
        }
    }
</script>
