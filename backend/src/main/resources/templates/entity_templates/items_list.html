<div
    th:fragment="item_list(label, new_item, list, list_item, list_item_label)"
    class="container"
>
    <h2 th:text="${name}"></h2>

    <div class="accordion mb-4" id="accordionNew">
        <div class="accordion-item border-primary">
            <h2 class="accordion-header">
                <button
                    class="accordion-button collapsed"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#collapseNew"
                    aria-controls="collapseNew"
                    aria-expanded="false"
                >
                    <div class="row w-100">
                        <div class="col">
                            <span
                                class="text-primary fw-bold"
                                th:text="'+ New ' + ${label}"
                            ></span>
                        </div>
                    </div>
                </button>
            </h2>
            <div
                id="collapseNew"
                class="accordion-collapse collapse"
                data-bs-parent="#accordionNew"
            >
                <div class="accordion-body">
                    <form
                        th:action="@{/edit/{entity}(entity=${entity})}"
                        method="post"
                    >
                        <!-- New item form -->
                        <div th:replace="${new_item}"></div>

                        <button class="btn btn-primary" type="submit">
                            Save
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:each="item : ${list}">
        <div class="accordion mb-2" th:attr="id=|accordion${item.id}|">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button
                        class="accordion-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        th:attr="data-bs-target=|#collapse${item.id}|, aria-controls=|collapse${item.id}|"
                        aria-expanded="false"
                    >
                        <div class="row w-100">
                            <div class="col-1" th:text="${item.id}"></div>

                            <!--Individual item label-->
                            <div class="col-11">
                                <span th:replace="${list_item_label}"></span>
                            </div>
                        </div>
                    </button>
                </h2>
                <div
                    th:attr="id=|collapse${item.id}|, data-bs-parent=|#accordion${item.id}|"
                    class="accordion-collapse collapse"
                >
                    <div class="accordion-body">
                        <form
                            th:action="@{/edit/{entity}(entity=${entity})}"
                            method="post"
                        >
                            <input
                                type="hidden"
                                name="id"
                                th:value="${item.id}"
                            />

                            <!-- individual item form -->
                            <div th:replace="${list_item}"></div>

                            <div class="d-flex gap-2">
                                <button class="btn btn-primary" type="submit">
                                    Save
                                </button>
                                <a
                                    th:href="@{/delete/{entity}/{id}(entity=${entity}, id=${item.id})}"
                                    class="btn btn-danger"
                                    onclick="
                                        return confirm('Delete this address?');
                                    "
                                    >Delete</a
                                >
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
